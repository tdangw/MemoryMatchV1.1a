
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#081b22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Memory Match Adventure - trò chơi ghép cặp thẻ trên mobile." />
  <title>Memory Match Adventure</title>
  <link rel="stylesheet" href="styles/icons.css" />
  <link rel="stylesheet" href="styles/game-shell/tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <link rel="stylesheet" href="styles/menu.css" />
  <link rel="stylesheet" href="styles/board.css" />
  <link rel="stylesheet" href="styles/gameplay-ui.css" />
  <link rel="stylesheet" href="styles/hud.css" />
  <link rel="stylesheet" href="styles/modals.css" />
  <link rel="stylesheet" href="styles/gameplay-effects.css" />
  <link rel="stylesheet" href="styles/shop.css" />
  <link rel="stylesheet" href="styles/link-connect.css" />
  <link rel="stylesheet" href="styles/tooltips.css" />
  <link rel="stylesheet" href="styles/game-shell/presentation.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/memory-match-icon.svg" />
</head>
<body>
  <div class="main-wrapper">
    <!-- Game shells mount here. -->

    <!-- Settings Overlay -->
    <div id="settings-container" style="display: none;">
      <div class="settings-control">
        <div class="settings-row">
          <label for="toggle-sound">Âm thanh hiệu ứng</label>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-sound" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="settings-range-row">
          <input
            id="sound-volume"
            class="settings-range"
            type="range"
            min="0"
            max="100"
            step="1"
            value="40"
            aria-label="Âm lượng hiệu ứng"
          />
          <output id="sound-volume-value">40%</output>
        </div>
      </div>

      <div class="settings-control">
        <div class="settings-row">
          <label for="toggle-music">Nhạc nền</label>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-music" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="settings-range-row">
          <input
            id="music-volume"
            class="settings-range"
            type="range"
            min="0"
            max="100"
            step="1"
            value="35"
            aria-label="Âm lượng nhạc"
          />
          <output id="music-volume-value">35%</output>
        </div>
      </div>

      <div class="settings-control">
        <div class="settings-row">
          <label for="toggle-meteor-effects">Hiệu ứng nền</label>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-meteor-effects" checked />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-control">
        <div class="settings-row">
          <label for="toggle-board-coordinates">Hiện tọa độ bàn cờ</label>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-board-coordinates" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-control">
        <div class="settings-row">
          <label for="toggle-card-descriptions">Hiển thị tên thẻ</label>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-card-descriptions" checked />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <button id="version-info" class="settings-version-button" type="button">
        <span data-icon="info"></span>
        <span>Phiên bản</span>
        <span id="settings-version-value"></span>
      </button>

      <!-- Audio player (hidden) -->
      <audio id="bg-music" loop></audio>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>

</body>
</html>
