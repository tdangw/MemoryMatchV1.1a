
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#081b22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Memory Match Adventure - trò chơi ghép cặp thẻ trên mobile." />
  <title>Memory Match Adventure</title>
  <link rel="stylesheet" href="styles/startup-loading.css" />
  <link rel="preload" as="image" href="/assets/images/home/memory-match-v2.webp" fetchpriority="high" />
  <link rel="stylesheet" href="styles/icons.css" />
  <link rel="stylesheet" href="styles/ui-art-tokens.css" />
  <link rel="stylesheet" href="styles/ui-theme.css" />
  <link rel="stylesheet" href="styles/game-shell/tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <link rel="stylesheet" href="styles/menu.css" />
  <link rel="stylesheet" href="styles/board.css" />
  <link rel="stylesheet" href="styles/gameplay-ui.css" />
  <link rel="stylesheet" href="styles/hud.css" />
  <link rel="stylesheet" href="styles/modals.css" />
  <link rel="stylesheet" href="styles/gameplay-effects.css" />
  <link rel="stylesheet" href="styles/shop.css" />
  <link rel="stylesheet" href="styles/link-connect.css" />
  <link rel="stylesheet" href="styles/triple-connect.css" />
  <link rel="stylesheet" href="styles/game-shell/hud-unified.css" />
  <link rel="stylesheet" href="styles/tooltips.css" />
  <link rel="stylesheet" href="styles/game-shell/presentation.css" />
  <link rel="stylesheet" href="styles/adventure.css" />
  <link rel="stylesheet" href="styles/ad-banner.css" />
  <link rel="stylesheet" href="styles/leaderboard.css" />
  <link rel="stylesheet" href="styles/app-tabs.css" />
  <link rel="stylesheet" href="styles/profile.css" />
  <link rel="stylesheet" href="styles/home-menu.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/memory-match-icon.svg" />
</head>
<body>
  <section id="app-loading" class="startup-loading" aria-label="Đang mở Memory Match Adventure">
    <div class="startup-loading__content">
      <h1 class="startup-loading__title"><span>Memory Match</span><span>Adventure</span></h1>
      <svg class="startup-loading__ornament" viewBox="0 0 150 22" aria-hidden="true" fill="none" stroke="currentColor"><path d="M0 11h61m28 0h61M68 11l7-7 7 7-7 7z"/><path d="M72 11h6"/></svg>
      <div class="startup-loading__progress" role="progressbar" aria-label="Tiến trình khởi động" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" aria-valuetext="Đang tải…"><span class="startup-loading__fill"></span><span class="startup-loading__activity" aria-hidden="true"></span></div>
      <p class="startup-loading__message" data-loading-message role="status">Đang tải…</p>
      <button class="startup-loading__retry" data-loading-retry type="button" hidden>Tải lại</button>
      <a class="startup-loading__retry startup-loading__fallback" href="">Tải lại</a>
      <noscript><p>Hãy bật JavaScript để mở trò chơi.</p></noscript>
    </div>
  </section>
  <div class="main-wrapper">
    <!-- Game shells mount here. -->

    <!-- Settings Overlay -->
    <div id="settings-container" style="display: none;">
      <section class="tab-card settings-section"><h3 class="tab-section-title">Âm thanh</h3><div class="settings-control"><div class="settings-row"><label for="toggle-sound">Âm thanh hiệu ứng</label><label class="toggle-switch"><input type="checkbox" id="toggle-sound" checked/><span class="slider"></span></label></div><div class="settings-range-row"><input id="sound-volume" class="settings-range" type="range" min="0" max="100" step="1" value="40" aria-label="Âm lượng hiệu ứng"/><output id="sound-volume-value">40%</output></div></div><div class="settings-control"><div class="settings-row"><label for="toggle-music">Nhạc nền</label><label class="toggle-switch"><input type="checkbox" id="toggle-music" checked/><span class="slider"></span></label></div><div class="settings-range-row"><input id="music-volume" class="settings-range" type="range" min="0" max="100" step="1" value="35" aria-label="Âm lượng nhạc"/><output id="music-volume-value">35%</output></div></div></section>
      <section class="tab-card settings-section"><h3 class="tab-section-title">Hiển thị</h3><div class="settings-control"><div class="settings-row"><label for="toggle-meteor-effects">Hiệu ứng nền</label><label class="toggle-switch"><input type="checkbox" id="toggle-meteor-effects" checked/><span class="slider"></span></label></div></div><div class="settings-control"><div class="settings-row"><label for="toggle-board-coordinates">Tọa độ bàn cờ</label><label class="toggle-switch"><input type="checkbox" id="toggle-board-coordinates" /><span class="slider"></span></label></div></div><div class="settings-control"><div class="settings-row"><label for="toggle-card-descriptions">Tên thẻ</label><label class="toggle-switch"><input type="checkbox" id="toggle-card-descriptions" checked/><span class="slider"></span></label></div></div></section>
      <section class="tab-card settings-section"><h3 class="tab-section-title">Thông tin và dữ liệu</h3>
        <button id="settings-help" class="settings-link" type="button"><span data-icon="book"></span><span>Hướng dẫn</span><span class="settings-chevron" aria-hidden="true">›</span></button>
        <button id="version-info" class="settings-link" type="button"><span data-icon="info"></span><span>Giới thiệu</span><span id="settings-version-value"></span><span class="settings-chevron" aria-hidden="true">›</span></button>
        <button id="settings-privacy-policy" class="settings-link" type="button"><span data-icon="info"></span><span>Quyền riêng tư</span><span class="settings-chevron" aria-hidden="true">›</span></button>
        <button id="settings-ad-privacy" class="settings-link" type="button" hidden><span data-icon="settings"></span><span>Quyền riêng tư quảng cáo</span><span class="settings-chevron" aria-hidden="true">›</span></button>
        <button id="settings-reset" class="settings-link settings-link--danger" type="button"><span data-icon="trash"></span><span>Xóa dữ liệu</span><span class="settings-chevron" aria-hidden="true">›</span></button>
      </section>
      <audio id="bg-music" loop></audio>
    </div>
  </div>

  <script type="module" src="/js/bootstrap.js"></script>

</body>
</html>
