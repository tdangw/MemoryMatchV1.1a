<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duyệt mẫu nền động</title>
<style>body{margin:0;background:#102333;color:#fff;font:14px system-ui}nav{display:flex;gap:12px;align-items:center;padding:10px}button{padding:8px}iframe{border:0;width:100vw;height:calc(100dvh - 60px);display:block}</style></head>
<body><nav><button id="home">Trang chủ</button><button id="memory">Mẫu hồ Memory</button><button id="off">Tắt mẫu</button><span id="status">Chọn cảnh trong game rồi bật mẫu tương ứng</span></nav>
<iframe src="/" title="Memory Match Adventure"></iframe>
<script type="module">
import { mountPilotScene } from '../../../js/background/pilotScene.js';
import css from '../../../styles/ambient-background.css?inline';
const frame = document.querySelector('iframe');
let scene = null;
function dispose() { if (scene) scene.dispose(); scene = null; }
frame.addEventListener('load', () => {
  dispose();
  const style = frame.contentDocument.createElement('style'); style.textContent = css; frame.contentDocument.head.append(style);
});
window.mountAmbientPilot = name => {
  dispose(); scene = mountPilotScene(frame.contentDocument, name);
  document.querySelector('#status').textContent = scene.diagnostics().kinds.length ? 'Mẫu đang chạy' : 'Vùng cảnh bị che — giữ nền tĩnh';
  return scene;
};
window.stopAmbientPilot = dispose;
window.ambientPilotDiagnostics = () => scene ? scene.diagnostics() : null;
for (const name of ['home', 'memory']) document.getElementById(name).onclick = () => window.mountAmbientPilot(name);
document.querySelector('#off').onclick = dispose;
window.addEventListener('pagehide', dispose);
</script></body></html>
